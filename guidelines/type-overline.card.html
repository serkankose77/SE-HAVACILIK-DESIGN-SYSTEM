<!-- @dsCard group="Type" viewport="700x170" name="Overline & Section Kicker" subtitle="Mono uppercase kickers + the orange accent rule" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; padding: 26px; background: var(--surface-page); font-family: var(--font-sans); }
  .stack { display: flex; flex-direction: column; gap: 6px; align-items: center; text-align: center; }
  .kick { font-family: var(--font-mono); font-size: 12px; letter-spacing: .22em; text-transform: uppercase; color: var(--text-brand); }
  h2 { font-family: var(--font-display); font-weight: 700; font-size: 36px; letter-spacing: -0.02em; color: var(--text-strong); }
  .rule { width: 64px; height: 3px; background: var(--se-orange-500); border-radius: 999px; margin-top: 4px; }
  .note { font-family: var(--font-mono); font-size: 11px; color: var(--text-muted); margin-top: 8px; letter-spacing:.03em; }
</style>
</head>
<body>
  <div class="stack">
    <div class="kick">Kalite Politikamız</div>
    <h2>Quality, Safety &amp; Excellence</h2>
    <div class="rule"></div>
    <div class="note">tracking .22em · uppercase mono · 64×3 orange rule beneath every section title</div>
  </div>
</body>
</html>
