<!-- @dsCard group="Brand" viewport="700x230" name="Logo — Primary" subtitle="Full lockup on light; orange S + charcoal E aircraft mark" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; padding: 0; background: var(--surface-page); font-family: var(--font-mono); display:flex; }
  .stage { flex: 1; display: flex; align-items: center; justify-content: center; padding: 32px; }
  .stage img { width: 300px; height: auto; }
  .side { width: 200px; border-left: 1px solid var(--border-subtle); padding: 24px 22px; display:flex; flex-direction:column; gap:10px; justify-content:center; background: var(--gray-50); }
  .side .t { font-size: 11px; color: var(--text-muted); letter-spacing:.04em; }
  .side .v { font-size: 12px; color: var(--text-strong); font-weight: 600; }
</style>
</head>
<body>
  <div class="stage"><img src="../assets/se-logo-full.png" alt="SE Havacılık ve Makina"></div>
  <div class="side">
    <div><div class="t">mark</div><div class="v">stylized aircraft</div></div>
    <div><div class="t">S</div><div class="v" style="color:var(--se-orange-600)">#F39200</div></div>
    <div><div class="t">E + wordmark</div><div class="v">#1D1D1B</div></div>
    <div><div class="t">use on</div><div class="v">white / gray-50</div></div>
  </div>
</body>
</html>
