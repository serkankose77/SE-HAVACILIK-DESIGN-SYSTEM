<!-- @dsCard group="Brand" viewport="700x230" name="Logo — On Dark" subtitle="Knockout lockup: orange S retained, E + wordmark to white" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; padding: 0; font-family: var(--font-mono); display:flex; }
  .stage { flex: 1; display: flex; align-items: center; justify-content: center; padding: 32px; background: var(--steel-900);
    background-image: linear-gradient(rgba(255,255,255,0.04) 1px,transparent 1px), linear-gradient(90deg, rgba(255,255,255,0.04) 1px,transparent 1px); background-size: 36px 36px; }
  .stage img { width: 300px; height: auto; }
  .side { width: 200px; padding: 24px 22px; display:flex; flex-direction:column; gap:10px; justify-content:center; background: var(--steel-800); }
  .side .t { font-size: 11px; color: var(--gray-400); letter-spacing:.04em; }
  .side .v { font-size: 12px; color: #fff; font-weight: 600; }
</style>
</head>
<body>
  <div class="stage"><img src="../assets/se-logo-full-ondark.png" alt="SE Havacılık ve Makina on dark"></div>
  <div class="side">
    <div><div class="t">S</div><div class="v" style="color:var(--se-orange-400)">#F39200 kept</div></div>
    <div><div class="t">E + wordmark</div><div class="v">→ #FFFFFF</div></div>
    <div><div class="t">use on</div><div class="v">steel-800/900</div></div>
    <div><div class="t">backdrop</div><div class="v">blueprint grid</div></div>
  </div>
</body>
</html>
