<!-- @dsCard group="Colors" viewport="700x190" name="Neutral Gray Scale" subtitle="Cool grays for text, surfaces & borders" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; padding: 22px; background: var(--surface-page); font-family: var(--font-sans); }
  .row { display: flex; gap: 0; border-radius: var(--radius-md); overflow: hidden; box-shadow: var(--shadow-sm); border: 1px solid var(--border-subtle); }
  .sw { flex: 1; height: 96px; display: flex; align-items: flex-end; padding: 8px; }
  .sw span { font-family: var(--font-mono); font-size: 10px; letter-spacing: .02em; }
  .meta { display: flex; gap: 16px; margin-top: 14px; }
  .lbl { font-family: var(--font-mono); font-size: 11px; color: var(--text-muted); letter-spacing: .04em; }
</style>
</head>
<body>
  <div class="row">
    <div class="sw" style="background:var(--gray-0); border-right:1px solid var(--border-subtle)"><span style="color:#333">0</span></div>
    <div class="sw" style="background:var(--gray-50)"><span style="color:#333">50</span></div>
    <div class="sw" style="background:var(--gray-100)"><span style="color:#333">100</span></div>
    <div class="sw" style="background:var(--gray-200)"><span style="color:#333">200</span></div>
    <div class="sw" style="background:var(--gray-300)"><span style="color:#333">300</span></div>
    <div class="sw" style="background:var(--gray-400)"><span style="color:#fff">400</span></div>
    <div class="sw" style="background:var(--gray-500)"><span style="color:#fff">500</span></div>
    <div class="sw" style="background:var(--gray-600)"><span style="color:#fff">600</span></div>
    <div class="sw" style="background:var(--gray-700)"><span style="color:#fff">700</span></div>
    <div class="sw" style="background:var(--gray-800)"><span style="color:#fff">800</span></div>
    <div class="sw" style="background:var(--gray-900)"><span style="color:#fff">900</span></div>
  </div>
  <div class="meta">
    <span class="lbl">700 body · 500 muted · 400 faint · 200 border · 50 subtle surface</span>
  </div>
</body>
</html>
