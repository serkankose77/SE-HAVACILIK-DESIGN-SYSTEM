<!-- @dsCard group="Colors" viewport="700x190" name="Brand — SE Orange" subtitle="Core mark color #F39200 with tints & shades" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; padding: 22px; background: var(--surface-page); font-family: var(--font-sans); }
  .row { display: flex; gap: 0; border-radius: var(--radius-md); overflow: hidden; box-shadow: var(--shadow-sm); }
  .sw { flex: 1; height: 96px; display: flex; align-items: flex-end; padding: 8px; }
  .sw span { font-family: var(--font-mono); font-size: 10px; letter-spacing: .02em; }
  .meta { display: flex; gap: 14px; margin-top: 14px; align-items: baseline; }
  .meta .big { font-family: var(--font-mono); font-weight: 600; color: var(--text-strong); font-size: 13px; }
  .meta .lbl { font-family: var(--font-mono); font-size: 11px; color: var(--text-muted); letter-spacing: .04em; }
</style>
</head>
<body>
  <div class="row">
    <div class="sw" style="background:var(--se-orange-50)"><span style="color:#7a4a00">50</span></div>
    <div class="sw" style="background:var(--se-orange-100)"><span style="color:#7a4a00">100</span></div>
    <div class="sw" style="background:var(--se-orange-200)"><span style="color:#7a4a00">200</span></div>
    <div class="sw" style="background:var(--se-orange-300)"><span style="color:#5e3700">300</span></div>
    <div class="sw" style="background:var(--se-orange-400)"><span style="color:#fff">400</span></div>
    <div class="sw" style="background:var(--se-orange-500)"><span style="color:#fff">500</span></div>
    <div class="sw" style="background:var(--se-orange-600)"><span style="color:#fff">600</span></div>
    <div class="sw" style="background:var(--se-orange-700)"><span style="color:#fff">700</span></div>
    <div class="sw" style="background:var(--se-orange-800)"><span style="color:#fff">800</span></div>
    <div class="sw" style="background:var(--se-orange-900)"><span style="color:#fff">900</span></div>
  </div>
  <div class="meta">
    <span class="big" style="color:var(--se-orange-500)">#F39200</span>
    <span class="lbl">500 · brand mark · rgb(243,146,0)</span>
    <span class="lbl">600 · #E67E00 hover / pressed</span>
  </div>
</body>
</html>
