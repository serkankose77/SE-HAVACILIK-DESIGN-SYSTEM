<!-- @dsCard group="Spacing" viewport="700x230" name="Card Anatomy" subtitle="Default card: white, 12px radius, md shadow, 2px brand frame variant" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; padding: 24px; background: var(--surface-subtle); font-family: var(--font-sans); }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
  .card { background: #fff; border-radius: var(--radius-lg); box-shadow: var(--shadow-md); padding: 20px; border: 1px solid var(--border-subtle); }
  .card.framed { border: 2px solid var(--se-orange-500); box-shadow: 0 5px 15px rgba(243,146,0,0.10); }
  .ico { width: 40px; height: 40px; border-radius: var(--radius-md); background: linear-gradient(135deg,var(--se-orange-500),var(--se-orange-600)); display:flex; align-items:center; justify-content:center; margin-bottom: 12px; }
  .ico svg { width: 22px; height: 22px; stroke: #fff; }
  h4 { font-family: var(--font-display); font-size: 17px; font-weight: 600; color: var(--text-strong); margin: 0 0 6px; }
  p { font-size: 13px; color: var(--text-muted); line-height: 1.5; margin: 0; }
  .tag { font-family: var(--font-mono); font-size: 10px; letter-spacing: .1em; text-transform: uppercase; color: var(--text-faint); margin-top: 12px; }
</style>
</head>
<body>
  <div class="grid">
    <div class="card">
      <div class="ico"><svg viewBox="0 0 24 24" fill="none" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg></div>
      <h4>Default Card</h4>
      <p>White surface, 12px radius, md shadow, hairline border. Rises 6px on hover.</p>
      <div class="tag">surface-card</div>
    </div>
    <div class="card framed">
      <div class="ico"><svg viewBox="0 0 24 24" fill="none" stroke-width="2"><path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"/></svg></div>
      <h4>Framed Card</h4>
      <p>2px orange frame + soft orange glow. Used for machine specs &amp; key offers.</p>
      <div class="tag">machine / spec</div>
    </div>
  </div>
</body>
</html>
