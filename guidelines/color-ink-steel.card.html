<!-- @dsCard group="Colors" viewport="700x190" name="Ink & Aerospace Steel" subtitle="Charcoal ink + cool slate scale for inverted surfaces" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; padding: 22px; background: var(--surface-page); font-family: var(--font-sans); }
  .row { display: flex; gap: 0; border-radius: var(--radius-md); overflow: hidden; box-shadow: var(--shadow-sm); }
  .sw { flex: 1; height: 96px; display: flex; align-items: flex-end; padding: 8px; }
  .sw span { font-family: var(--font-mono); font-size: 10px; color: #fff; letter-spacing: .02em; }
  .meta { display: flex; gap: 16px; margin-top: 14px; }
  .lbl { font-family: var(--font-mono); font-size: 11px; color: var(--text-muted); letter-spacing: .04em; }
</style>
</head>
<body>
  <div class="row">
    <div class="sw" style="background:var(--se-ink)"><span>ink&nbsp;1D1D1B</span></div>
    <div class="sw" style="background:var(--steel-950)"><span>950</span></div>
    <div class="sw" style="background:var(--steel-900)"><span>900</span></div>
    <div class="sw" style="background:var(--steel-800)"><span>800</span></div>
    <div class="sw" style="background:var(--steel-700)"><span>700</span></div>
    <div class="sw" style="background:var(--steel-600)"><span>600</span></div>
    <div class="sw" style="background:var(--steel-500)"><span>500</span></div>
  </div>
  <div class="meta">
    <span class="lbl">--se-ink · logo charcoal · headings & body strong</span>
    <span class="lbl">--steel-900 · default dark / blueprint surface</span>
  </div>
</body>
</html>
