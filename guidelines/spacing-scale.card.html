<!-- @dsCard group="Spacing" viewport="700x180" name="Spacing Scale" subtitle="4px base grid — 4 to 128" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; padding: 24px; background: var(--surface-page); font-family: var(--font-mono); }
  .row { display: flex; align-items: flex-end; gap: 16px; }
  .item { display: flex; flex-direction: column; align-items: center; gap: 8px; }
  .bar { background: var(--se-orange-500); border-radius: 2px; width: 26px; }
  .lbl { font-size: 11px; color: var(--text-strong); font-weight: 600; }
  .px { font-size: 10px; color: var(--text-muted); }
</style>
</head>
<body>
  <div class="row">
    <div class="item"><div class="bar" style="height:4px"></div><div class="lbl">1</div><div class="px">4</div></div>
    <div class="item"><div class="bar" style="height:8px"></div><div class="lbl">2</div><div class="px">8</div></div>
    <div class="item"><div class="bar" style="height:12px"></div><div class="lbl">3</div><div class="px">12</div></div>
    <div class="item"><div class="bar" style="height:16px"></div><div class="lbl">4</div><div class="px">16</div></div>
    <div class="item"><div class="bar" style="height:24px"></div><div class="lbl">5</div><div class="px">24</div></div>
    <div class="item"><div class="bar" style="height:32px"></div><div class="lbl">6</div><div class="px">32</div></div>
    <div class="item"><div class="bar" style="height:40px"></div><div class="lbl">7</div><div class="px">40</div></div>
    <div class="item"><div class="bar" style="height:48px"></div><div class="lbl">8</div><div class="px">48</div></div>
    <div class="item"><div class="bar" style="height:64px"></div><div class="lbl">10</div><div class="px">64</div></div>
    <div class="item"><div class="bar" style="height:80px"></div><div class="lbl">12</div><div class="px">80</div></div>
  </div>
</body>
</html>
