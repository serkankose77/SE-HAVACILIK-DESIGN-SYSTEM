<!-- @dsCard group="Type" viewport="700x230" name="Display — Saira" subtitle="Technical grotesque for headings; tight tracking" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; padding: 24px; background: var(--surface-page); }
  .kick { font-family: var(--font-mono); font-size: 11px; letter-spacing: .18em; text-transform: uppercase; color: var(--text-brand); margin-bottom: 10px; }
  .d1 { font-family: var(--font-display); font-weight: 700; font-size: 56px; line-height: 1.0; letter-spacing: -0.02em; color: var(--text-strong); }
  .d1 em { font-style: normal; color: var(--se-orange-500); }
  .d2 { font-family: var(--font-display); font-weight: 600; font-size: 28px; letter-spacing: -0.01em; color: var(--text-strong); margin-top: 14px; }
  .specs { font-family: var(--font-mono); font-size: 11px; color: var(--text-muted); margin-top: 16px; display:flex; gap:18px; }
</style>
</head>
<body>
  <div class="kick">Hassas İşleme · Precision Machining</div>
  <div class="d1"><em>SE</em> Havacılık &amp; Makina</div>
  <div class="d2">Aerospace components, machined to tolerance</div>
  <div class="specs"><span>Saira</span><span>700 / 600</span><span>tracking −0.02em</span><span>line-height 1.0–1.2</span></div>
</body>
</html>
