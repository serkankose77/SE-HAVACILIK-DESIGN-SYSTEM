<!-- @dsCard group="Type" viewport="700x230" name="Mono — Specs & Measurements" subtitle="IBM Plex Mono for tolerances, dimensions, part data" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; padding: 24px; background: var(--surface-page); font-family: var(--font-mono); }
  .table { border: 1px solid var(--border-subtle); border-radius: var(--radius-md); overflow: hidden; max-width: 560px; }
  .tr { display: flex; justify-content: space-between; padding: 9px 14px; border-bottom: 1px solid var(--border-subtle); font-size: 13px; }
  .tr:last-child { border-bottom: 0; }
  .tr:nth-child(odd) { background: var(--gray-50); }
  .k { color: var(--text-muted); letter-spacing: .03em; }
  .v { color: var(--text-strong); font-weight: 600; font-variant-numeric: tabular-nums; }
  .ov { font-size: 11px; letter-spacing: .18em; text-transform: uppercase; color: var(--text-brand); margin-bottom: 12px; }
</style>
</head>
<body>
  <div class="ov">HAAS UMC750 · 5-Axis VMC</div>
  <div class="table">
    <div class="tr"><span class="k">X · Y · Z Travel</span><span class="v">762 × 508 × 508 mm</span></div>
    <div class="tr"><span class="k">Spindle Speed</span><span class="v">8,100 RPM</span></div>
    <div class="tr"><span class="k">Tool Changer</span><span class="v">24 Position</span></div>
    <div class="tr"><span class="k">CMM Accuracy</span><span class="v">±2.5 μm</span></div>
    <div class="tr"><span class="k">Capacity</span><span class="v">Ø750 mm</span></div>
  </div>
</body>
</html>
